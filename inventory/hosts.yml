---
# Connection details are declared once, up front. The groups below describe
# what each host *does*, not where it sits, so a host can belong to several of
# them and playbooks can target a capability instead of a machine name.
all:
  hosts:
    laptop:
      ansible_host: localhost
      ansible_connection: local
    media:
      ansible_host: media.tail950f.ts.net
      ansible_connection: ssh
    outpost:
      ansible_host: outpost.tail950f.ts.net
      ansible_connection: ssh

  children:
    # Daily drivers: OS baseline and backups only.
    workstations:
      hosts:
        laptop:

    # Runs the Podman Quadlet container stack.
    quadlet_hosts:
      hosts:
        media:

    # Hosts a bare-repo Git server over git-shell.
    git_servers:
      hosts:
        media:

    # Runs the Postfix relay.
    mail_servers:
      hosts:
        outpost:
