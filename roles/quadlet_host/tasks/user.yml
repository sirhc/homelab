---
- name: Create homelab group
  ansible.builtin.group:
    name: "{{ homelab_group }}"
    state: present

- name: Create homelab user
  ansible.builtin.user:
    name: "{{ homelab_user }}"
    group: "{{ homelab_group }}"
    groups: dialout
    append: true
    shell: /bin/zsh
    create_home: true
    password: "!"
    state: present
  register: homelab_user_info

- name: Set homelab user facts
  ansible.builtin.set_fact:
    homelab_home: "{{ homelab_user_info.home }}"
    homelab_uid: "{{ homelab_user_info.uid }}"

- name: Enable linger for homelab user
  ansible.builtin.command:
    cmd: loginctl enable-linger {{ homelab_user }}
    creates: /var/lib/systemd/linger/{{ homelab_user }}
