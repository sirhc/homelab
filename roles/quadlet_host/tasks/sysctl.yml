---
- name: Allow unprivileged binding from port 53 (Pi-hole, Traefik)
  ansible.posix.sysctl:
    name: net.ipv4.ip_unprivileged_port_start
    value: "53"
    sysctl_file: /etc/sysctl.d/90-homelab.conf
    reload: true

- name: Enable IPv6 forwarding (homelab bridge)
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.forwarding
    value: "1"
    sysctl_file: /etc/sysctl.d/90-homelab.conf
    reload: true
