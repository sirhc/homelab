---
# Distrusts CA roots that Fedora still ships but shouldn't be trusted. Covers
# the system store (curl, dnf, OpenSSL, Python, git), not Firefox or Chrome,
# which bundle their own roots.
#
# comodo-aaa.pem: "Comodo AAA Services root" (CN=AAA Certificate Services),
# blocked after intermediates under it were compromised (Red Hat solution
# 7149312). Once a fixed ca-certificates package ships, set its state in
# defaults/main.yml to "absent" for one run, then delete the entry and the file.
- name: Block distrusted CA roots
  ansible.builtin.copy:
    src: "ca-blocklist/{{ item.name }}"
    dest: "/etc/pki/ca-trust/source/blocklist/{{ item.name }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ ca_blocklist | selectattr('state', 'eq', 'present') }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Update CA trust

- name: Unblock retired CA roots
  ansible.builtin.file:
    path: "/etc/pki/ca-trust/source/blocklist/{{ item.name }}"
    state: absent
  loop: "{{ ca_blocklist | selectattr('state', 'eq', 'absent') }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Update CA trust
