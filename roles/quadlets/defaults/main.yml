---
homelab_user: homelab
homelab_group: homelab

homelab_xdg_config_home: "{{ homelab_home }}/.config"
homelab_xdg_cache_home: "{{ homelab_home }}/.cache"
homelab_xdg_data_home: "{{ homelab_home }}/.local/share"
homelab_xdg_log_home: "{{ homelab_home }}/.local/state"

homelab_quadlet_dir: "{{ homelab_xdg_config_home }}/containers/systemd"
homelab_environment_dir: "{{ homelab_xdg_config_home }}/environment.d"
homelab_user_dir: "{{ homelab_xdg_config_home }}/systemd/user"

enabled_services: []

# Remove Quadlet files no longer defined by the repo. Stale entries are always
# reported; this controls whether they are actually deleted. Off by default so a
# rename cannot silently stop a running service — turn it on once the host and
# the repo agree.
quadlet_prune: false

# Entries in the Quadlet directory that are not derived from enabled_services
# and must survive a prune.
quadlet_prune_keep:
  - homelab.network
  - container.d

pihole_cnames: []
pihole_upstreams:
  - 208.67.222.222
  - 208.67.220.220
  - 2620:119:35::35
  - 2620:119:53::53

plex_advertise_ip: "https://127.0.0.1:32400/"
plex_allowed_networks:
  - 192.168.86.0/24
  - 100.64.0.0/10
  - 172.17.0.0/16
  - 172.18.0.0/16

openweather_city: "San Marcos, CA"

# NWS observation station for nws_exporter (https://api.weather.gov/stations).
nws_station: D5683

tududi_user_email: chris@grau.org
