---
- name: Reload systemd user daemon
  ansible.builtin.systemd:
    daemon_reload: true
    scope: user
  become_user: "{{ homelab_user }}"
  environment:
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ homelab_uid }}/bus"
    XDG_RUNTIME_DIR: "/run/user/{{ homelab_uid }}"

# Traefik reads traefik.yaml only at startup; the file provider picks up rules
# changes on its own.
- name: Restart Traefik
  ansible.builtin.systemd:
    name: traefik.service
    scope: user
    state: restarted
  become_user: "{{ homelab_user }}"
  environment:
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ homelab_uid }}/bus"
    XDG_RUNTIME_DIR: "/run/user/{{ homelab_uid }}"
