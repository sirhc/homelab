---
# Env files hold live secrets, so they are rendered from templates that
# reference vault vars. Filename must match the unit name: the .container files
# refer to their env file as `EnvironmentFile=./%N.env`.
- name: Check for service env templates
  ansible.builtin.stat:
    path: "{{ role_path }}/templates/env/{{ item }}/{{ item }}.env.j2"
  loop: "{{ enabled_services }}"
  register: env_templates
  delegate_to: localhost
  become: false

- name: Deploy service env files
  ansible.builtin.template:
    src: "env/{{ item.item }}/{{ item.item }}.env.j2"
    dest: "{{ homelab_quadlet_dir }}/{{ item.item }}.env"
    mode: "0600"
    owner: "{{ homelab_user }}"
    group: "{{ homelab_group }}"
  loop: "{{ env_templates.results | selectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.item }}"
  no_log: true
  notify: Reload systemd user daemon
