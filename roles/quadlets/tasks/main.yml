---
- name: Get homelab user info
  ansible.builtin.getent:
    database: passwd
    key: "{{ homelab_user }}"

- name: Set homelab UID fact
  ansible.builtin.set_fact:
    homelab_uid: "{{ ansible_facts.getent_passwd[homelab_user][1] }}"

- import_tasks: system.yml
- import_tasks: quadlet_files.yml
- import_tasks: env_files.yml
- import_tasks: configs.yml
- import_tasks: pihole_dropin.yml
- import_tasks: services.yml
