---
# Units must exist before we can start them, so run any pending daemon-reload
# now rather than at the end of the play.
- name: Reload systemd so newly deployed quadlets are generated
  ansible.builtin.meta: flush_handlers

# No `enabled: true` here: Quadlet units are generated by
# podman-system-generator at daemon-reload, and systemd refuses to enable a
# generated unit. Boot-time start comes from `[Install] WantedBy=default.target`
# in each .container file plus linger on the homelab user.
- name: Start quadlet services
  ansible.builtin.systemd:
    name: "{{ item }}.service"
    scope: user
    state: started
  become: true
  become_user: "{{ homelab_user }}"
  environment:
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ homelab_uid }}/bus"
    XDG_RUNTIME_DIR: "/run/user/{{ homelab_uid }}"
  loop: "{{ enabled_services }}"
