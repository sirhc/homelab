---
# Units must exist before we can start them, so run any pending daemon-reload
# now rather than at the end of the play.
- name: Reload systemd so newly deployed quadlets are generated
  ansible.builtin.meta: flush_handlers

# A daemon-reload regenerates the .service unit but never touches the running
# container, so a changed .container / .env / drop-in / config file would other-
# wise not take effect until the next manual `just restart`. Collect every
# service whose inputs changed on this run and restart exactly those below.
#
# Out of scope on purpose: changes to the shared network or the shared
# container.d/service.d drop-ins (system.yml) affect every container at once and
# a mass restart is too blunt to do unprompted — bounce those by hand.
- name: Determine which services have pending definition changes
  ansible.builtin.set_fact:
    quadlet_changed_services: >-
      {{ (
           (quadlet_unit_files.results | default([]) | selectattr('changed') | map(attribute='item') | list)
           + (quadlet_env_files.results | default([]) | selectattr('changed') | map(attribute='item.item') | list)
           + (quadlet_dropin_files.results | default([]) | selectattr('changed')
              | map(attribute='item.path') | map('dirname') | map('basename') | list)
           + (quadlet_config_files.results | default([]) | selectattr('changed') | map(attribute='item.item') | list)
           + (quadlet_config_templates.results | default([]) | selectattr('changed')
              | map(attribute='item.path') | map('dirname') | map('basename') | list)
         ) | unique | intersect(enabled_services) }}

# No `enabled: true` here: Quadlet units are generated by
# podman-system-generator at daemon-reload, and systemd refuses to enable a
# generated unit. Boot-time start comes from `[Install] WantedBy=default.target`
# in each .container file plus linger on the homelab user.
- name: Start quadlet services
  ansible.builtin.systemd:
    name: "{{ item }}.service"
    scope: user
    state: started
  become: true
  become_user: "{{ homelab_user }}"
  environment:
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ homelab_uid }}/bus"
    XDG_RUNTIME_DIR: "/run/user/{{ homelab_uid }}"
  loop: "{{ enabled_services }}"

- name: Restart services whose definitions changed
  ansible.builtin.systemd:
    name: "{{ item }}.service"
    scope: user
    state: restarted
  become: true
  become_user: "{{ homelab_user }}"
  environment:
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ homelab_uid }}/bus"
    XDG_RUNTIME_DIR: "/run/user/{{ homelab_uid }}"
  loop: "{{ quadlet_changed_services | default([]) }}"
