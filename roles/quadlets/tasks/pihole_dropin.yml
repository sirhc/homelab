---
# Pi-hole must bind :53 to a specific host address rather than 0.0.0.0, or it
# hijacks the Podman network's internal DNS and container-name resolution
# breaks. Each instance binds a different address, so the PublishPort lines
# live in a per-unit drop-in rather than in the shared .container file.
- name: Configure Pi-hole port bindings
  vars:
    pihole_bind_ips:
      pihole-local: "{{ pihole_local_ip | default('') }}"
      pihole-tailnet: "{{ pihole_tailnet_ip | default('') }}"
    pihole_instances: "{{ enabled_services | select('in', ['pihole-local', 'pihole-tailnet']) | list }}"
  block:
    - name: Create Pi-hole drop-in directories
      ansible.builtin.file:
        path: "{{ homelab_quadlet_dir }}/{{ item }}.container.d"
        state: directory
        mode: "0755"
        owner: "{{ homelab_user }}"
        group: "{{ homelab_group }}"
      loop: "{{ pihole_instances }}"

    - name: Deploy Pi-hole publish-port drop-ins
      ansible.builtin.template:
        src: pihole-publish-ports.conf.j2
        dest: "{{ homelab_quadlet_dir }}/{{ item }}.container.d/publish-ports.conf"
        mode: "0644"
        owner: "{{ homelab_user }}"
        group: "{{ homelab_group }}"
      vars:
        pihole_bind_ip: "{{ pihole_bind_ips[item] }}"
      loop: "{{ pihole_instances }}"
      notify: Reload systemd user daemon
