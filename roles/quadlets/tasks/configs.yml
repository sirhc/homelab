---
# Traefik is handled separately below: its static config is templated and its
# dynamic rules are opt-in per host via traefik_rules.
- name: Check for static config directories
  ansible.builtin.stat:
    path: "{{ role_path }}/files/config/{{ item }}"
  loop: "{{ enabled_services | reject('equalto', 'traefik') | list }}"
  register: static_config_dirs
  delegate_to: localhost
  become: false

- name: Deploy static config files
  ansible.builtin.copy:
    src: "config/{{ item.item }}/"
    dest: "{{ homelab_xdg_config_home }}/{{ item.item }}/"
    mode: "0644"
    owner: "{{ homelab_user }}"
    group: "{{ homelab_group }}"
  loop: "{{ static_config_dirs.results | selectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.item }}"

- name: Configure Traefik
  when: "'traefik' in enabled_services"
  block:
    - name: Create Traefik config directories
      ansible.builtin.file:
        path: "{{ homelab_xdg_config_home }}/traefik/{{ item }}"
        state: directory
        mode: "0755"
        owner: "{{ homelab_user }}"
        group: "{{ homelab_group }}"
      loop: ["", "rules", "certs"]

    - name: Deploy Traefik static configuration
      ansible.builtin.template:
        src: "config/traefik/traefik.yaml.j2"
        dest: "{{ homelab_xdg_config_home }}/traefik/traefik.yaml"
        mode: "0644"
        owner: "{{ homelab_user }}"
        group: "{{ homelab_group }}"
      notify: Restart Traefik

    # Rules are picked up by Traefik's file provider without a restart.
    - name: Deploy Traefik dynamic rules
      ansible.builtin.copy:
        src: "config/traefik/rules/{{ item }}"
        dest: "{{ homelab_xdg_config_home }}/traefik/rules/{{ item }}"
        mode: "0644"
        owner: "{{ homelab_user }}"
        group: "{{ homelab_group }}"
      loop: "{{ traefik_rules }}"
