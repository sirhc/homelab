---
- name: Create systemd user directory for restic
  ansible.builtin.file:
    path: "{{ restic_home }}/.config/systemd/user"
    state: directory
    owner: "{{ restic_user }}"
    group: "{{ restic_group }}"
    mode: "0755"

- name: Deploy resticprofile backup service units
  ansible.builtin.template:
    src: resticprofile-backup.service.j2
    dest: "{{ restic_home }}/.config/systemd/user/resticprofile-backup-{{ item.name }}.service"
    owner: "{{ restic_user }}"
    group: "{{ restic_group }}"
    mode: "0644"
  loop: "{{ restic_schedules }}"
  notify: Reload user systemd daemon

- name: Deploy resticprofile backup timer units
  ansible.builtin.template:
    src: resticprofile-backup.timer.j2
    dest: "{{ restic_home }}/.config/systemd/user/resticprofile-backup-{{ item.name }}.timer"
    owner: "{{ restic_user }}"
    group: "{{ restic_group }}"
    mode: "0644"
  loop: "{{ restic_schedules }}"
  notify: Reload user systemd daemon

- name: Enable and start resticprofile backup timers
  ansible.builtin.systemd:
    name: "resticprofile-backup-{{ item.name }}.timer"
    state: started
    enabled: true
    scope: user
  loop: "{{ restic_schedules }}"
  become: true
  become_user: "{{ restic_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ restic_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ restic_uid }}/bus"
