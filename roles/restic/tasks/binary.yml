---
# Read-only discovery: must run even under --check, otherwise the uri module
# skips, restic_release_info has no .json, and the set_fact below blows up.
- name: Get latest restic release
  ansible.builtin.uri:
    url: https://api.github.com/repos/restic/restic/releases/latest
    return_content: true
  register: restic_release_info
  check_mode: false

- name: Set restic version facts
  ansible.builtin.set_fact:
    restic_latest_version: "{{ restic_release_info.json.tag_name | regex_replace('^v', '') }}"
    restic_arch: "{{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else 'arm64' }}"

- name: Check installed restic version
  ansible.builtin.command:
    cmd: "{{ restic_home }}/bin/restic version"
  register: restic_installed
  failed_when: false
  changed_when: false
  check_mode: false

- name: Download and install restic
  when: restic_latest_version not in (restic_installed.stdout | default(''))
  block:
    - name: Download restic binary
      ansible.builtin.get_url:
        url: "https://github.com/restic/restic/releases/download/v{{ restic_latest_version }}/restic_{{ restic_latest_version }}_linux_{{ restic_arch }}.bz2"
        dest: "/tmp/restic_{{ restic_latest_version }}_linux_{{ restic_arch }}.bz2"
        mode: "0644"

    - name: Decompress and install restic binary
      ansible.builtin.shell:
        cmd: "bunzip2 -c /tmp/restic_{{ restic_latest_version }}_linux_{{ restic_arch }}.bz2 > {{ restic_home }}/bin/restic"
      changed_when: true

    - name: Set restic binary ownership and permissions
      ansible.builtin.file:
        path: "{{ restic_home }}/bin/restic"
        owner: "{{ restic_user }}"
        group: "{{ restic_group }}"
        mode: "0755"

    - name: Remove downloaded archive
      ansible.builtin.file:
        path: "/tmp/restic_{{ restic_latest_version }}_linux_{{ restic_arch }}.bz2"
        state: absent

- name: Set restic capabilities
  community.general.capabilities:
    path: "{{ restic_home }}/bin/restic"
    capability: "cap_dac_read_search=+ep"
    state: present
