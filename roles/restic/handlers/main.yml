---
- name: Schedule resticprofile backups
  ansible.builtin.command:
    cmd: "resticprofile --config /home/{{ restic_user }}/.config/resticprofile/profiles.conf schedule --all"
  become_user: "{{ restic_user }}"
  environment:
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ restic_uid }}/bus"
    XDG_RUNTIME_DIR: "/run/user/{{ restic_uid }}"
