---
- name: Create git user
  ansible.builtin.user:
    name: git
    shell: /usr/bin/git-shell
    create_home: true
    password: "!"
    state: present

- name: Create git SSH directory
  ansible.builtin.file:
    path: /home/git/.ssh
    state: directory
    owner: git
    group: git
    mode: "0700"

# An explicit path keeps this working under --check on a host where the git
# user does not exist yet; the task above already creates and owns ~git/.ssh.
- name: Deploy git authorized keys
  ansible.posix.authorized_key:
    user: git
    key: "{{ item }}"
    path: /home/git/.ssh/authorized_keys
    manage_dir: false
    state: present
  loop: "{{ git_authorized_keys }}"

- name: Create git repos directory
  ansible.builtin.file:
    path: /home/git/repos
    state: directory
    owner: git
    group: git
    mode: "0755"
